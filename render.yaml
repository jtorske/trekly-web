# Render Blueprint for the Trekly API. Values marked `sync: false` are entered
# in the Render dashboard when the Blueprint is first applied, and are never
# stored in this file.
services:
  - type: web
    name: trekly-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    # Closest Render region to the Supabase project (ca-central-1).
    region: virginia
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Supabase pooler (Supavisor, session mode), not the direct db.* host:
      # the direct host is IPv6-only and Render has no outbound IPv6.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Exact origins, comma-separated: production plus any custom domain.
      - key: CORS_ORIGINS
        sync: false
      # Vercel preview deployments, whose hostnames change on every push.
      - key: CORS_ORIGIN_REGEX
        sync: false
      # Site links in alert emails.
      - key: APP_URL
        sync: false
      - key: EMAIL_BACKEND
        value: console
      # No public Swagger UI or OpenAPI schema (also off by default on Render).
      - key: API_DOCS
        value: "false"
