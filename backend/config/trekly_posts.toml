# Automatic @trekly posts (app/trekly_posts/, run daily by scripts/trekly_posts.py).
#
# Each type below can be switched off (`enabled`) and runs only on its `days`
# (mon..sun, in `timezone`). A run makes at most one draft per type. Drafts
# wait on /admin/trekly-posts until an admin approves them; the per-type
# auto-publish toggle there (off by default for every type) lets the daily run
# publish a type's drafts on its own.
#
# `ai = true` lets the Claude API rewrite the template text when
# ANTHROPIC_API_KEY is set and [ai].enabled is true. Its text is kept only if
# it passes the fact check; otherwise the template text is used. Conditions
# posts never go through the AI, whatever this file says.

timezone = "America/Edmonton"

[pacing]
# At most this many @trekly posts per local day (any kind, manual ones included).
max_posts_per_day = 1
# Skip publishing on a day when real hikers shared at least this many posts
# in the last `busy_window_hours`.
busy_post_count = 6
busy_window_hours = 24
# Never post about the same trail again within this many days.
trail_cooldown_days = 30

[ai]
enabled = true
model = "claude-opus-5-5"
max_chars = 280

[digest]
# Email admins once a day when drafts are waiting. Recipients come from
# TREKLY_POSTS_DIGEST_TO (comma-separated), else the ADMIN_USER_IDS accounts.
enabled = true

[types.trending]
enabled = true
days = ["mon"]
ai = true
# Days a draft stays reviewable before it's marked expired.
expires_after_days = 3
# Only call a trail trending when this many different real hikers logged or
# saved it in the last 7 days (so a post can't point at one person's hike).
min_hikers = 3

[types.spotlight]
enabled = true
days = ["wed", "sat"]
ai = true
expires_after_days = 5
# Seasonal windows (month, day), inclusive. Larch trails are tagged "larch".
larch_window = [[9, 12], [10, 8]]
# Shoulder seasons: favour trails whose top is at or below low_elevation_max_m.
shoulder_windows = [[[4, 15], [6, 15]], [[10, 9], [11, 15]]]
low_elevation_max_m = 1800

[types.new_on_trekly]
enabled = true
days = ["tue", "fri"]
ai = true
expires_after_days = 7
# Trails and photos added within this many days count as new.
lookback_days = 14

[types.roundup]
enabled = true
days = ["sun"]
ai = true
expires_after_days = 3
# Anonymous totals only, and only when enough hikers took part that the totals
# can't point at anyone.
min_hikers = 5
min_hikes = 8

[types.fun_fact]
enabled = true
days = ["thu"]
# Approved facts are posted word for word.
ai = false
expires_after_days = 14
# A fact isn't reused within this many days.
fact_cooldown_days = 180

[types.conditions]
# Off until Trekly's use is confirmed as non-commercial under the Parks Canada
# terms (https://parks.canada.ca/termes-terms), or permission is given.
# Avalanche Canada forecasts aren't included: their terms forbid reproduction
# without written consent.
enabled = false
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
ai = false
expires_after_days = 2
# Only bulletins issued within this many days, whose titles match these words.
max_age_days = 3
keywords = ["closure", "closed", "warning", "advisory", "restriction", "restricted", "caution"]

[[types.conditions.sources]]
park = "Banff National Park"
url = "https://parks.canada.ca/pn-np/ab/banff/bulletins"

[[types.conditions.sources]]
park = "Jasper National Park"
url = "https://parks.canada.ca/pn-np/ab/jasper/bulletins"

[[types.conditions.sources]]
park = "Yoho National Park"
url = "https://parks.canada.ca/pn-np/bc/yoho/bulletins"

[[types.conditions.sources]]
park = "Kootenay National Park"
url = "https://parks.canada.ca/pn-np/bc/kootenay/bulletins"

[[types.conditions.sources]]
park = "Waterton Lakes National Park"
url = "https://parks.canada.ca/pn-np/ab/waterton/bulletins"

# Features to announce in "New on Trekly", written by hand. Each is posted
# once (keyed by `id`). `text` is used word for word; `url` is a site path.
