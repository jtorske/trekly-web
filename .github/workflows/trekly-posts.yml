# Drafts the day's automatic @trekly posts (backend/scripts/trekly_posts.py),
# publishes at most one if an admin approved it or its type auto-publishes,
# and emails the review digest. Once a day: about a minute of Actions time.
# The run is idempotent (keyed drafts, one post a day, one digest a day), so a
# late, doubled or manually re-run job changes nothing.
name: Trekly posts

on:
  schedule:
    # 15:00 UTC = 8 am MST / 9 am MDT. GitHub may start it a little late.
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: trekly-posts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      EMAIL_BACKEND: resend
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      # Who gets the daily digest (comma-separated).
      TREKLY_POSTS_DIGEST_TO: ${{ secrets.TREKLY_POSTS_DIGEST_TO }}
      # Optional: friendlier wording through the Claude API. Without it every
      # post uses its template text.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check configuration
        id: config
        working-directory: .
        run: |
          missing=""
          for name in DATABASE_URL APP_URL RESEND_API_KEY RESEND_FROM_EMAIL TREKLY_POSTS_DIGEST_TO; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Trekly posts skipped; missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-python@v7
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Draft and publish
        if: steps.config.outputs.ready == 'true'
        run: python scripts/trekly_posts.py run
