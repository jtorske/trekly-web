# Drafts the day's automatic @trekly posts (backend/scripts/trekly_posts.py)
# and publishes at most one (every type auto-publishes unless an admin turned
# it off). Posts whose AI text fails the fact check are skipped. With
# TREKLY_POSTS_DIGEST_TO set, it emails a record of what went out. Once a day:
# about a minute of Actions time.
# The run is idempotent (keyed drafts, one post a day, one digest a day), so a
# late, doubled or manually re-run job changes nothing.
name: Trekly posts

on:
  schedule:
    # 15:00 UTC = 8 am MST / 9 am MDT. GitHub may start it a little late.
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: trekly-posts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Optional: links in the email and in "New on Trekly" feature posts.
      APP_URL: ${{ secrets.APP_URL }}
      EMAIL_BACKEND: resend
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      # Optional: who gets the daily record of what went out (comma-separated).
      # Needs RESEND_API_KEY and RESEND_FROM_EMAIL too. Unset: no email.
      TREKLY_POSTS_DIGEST_TO: ${{ secrets.TREKLY_POSTS_DIGEST_TO }}
      # Optional: friendlier wording through the Claude API. Without it every
      # post uses its template text.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check configuration
        id: config
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Trekly posts skipped; missing secret: DATABASE_URL"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$TREKLY_POSTS_DIGEST_TO" ] && { [ -z "$RESEND_API_KEY" ] || [ -z "$RESEND_FROM_EMAIL" ]; }; then
            echo "::warning::TREKLY_POSTS_DIGEST_TO is set but RESEND_API_KEY or RESEND_FROM_EMAIL isn't; posting without the email"
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-python@v7
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Draft and publish
        if: steps.config.outputs.ready == 'true'
        run: python scripts/trekly_posts.py run
