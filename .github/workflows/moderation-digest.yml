# Emails the admin an hourly digest of new held and reported content
# (backend/scripts/moderation_digest.py). The script itself sends at most one
# digest an hour, so a late or doubled run is harmless.
name: Moderation digest

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: moderation-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      EMAIL_BACKEND: resend
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
    steps:
      - name: Check configuration
        id: config
        working-directory: .
        run: |
          missing=""
          for name in DATABASE_URL APP_URL RESEND_API_KEY RESEND_FROM_EMAIL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Moderation digest skipped; missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-python@v7
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Send digest
        if: steps.config.outputs.ready == 'true'
        run: python scripts/moderation_digest.py
