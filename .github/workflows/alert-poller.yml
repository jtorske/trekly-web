# Runs the campground alert poller (backend/scripts/poll_alerts.py) on a
# schedule. The poller itself refuses overlapping runs (job_locks lease) and
# caps its Parks Canada requests, so a late or doubled run is harmless.
name: Alert poller

on:
  schedule:
    # GitHub may start scheduled runs several minutes late under load.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: alert-poller
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      EMAIL_BACKEND: sendgrid
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
      # A little under the 30-minute schedule, so a run that GitHub starts a
      # few minutes early relative to the last one isn't skipped.
      ALERT_POLL_MIN_INTERVAL_MINUTES: "25"
    steps:
      # An alert fires only once, so polling without a real mail sender would
      # use up alerts without telling anyone. Skip until every secret is set.
      - name: Check configuration
        id: config
        working-directory: .
        run: |
          missing=""
          for name in DATABASE_URL APP_URL SENDGRID_API_KEY SENDGRID_FROM_EMAIL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Alert poller skipped; missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Poll alerts
        if: steps.config.outputs.ready == 'true'
        run: python scripts/poll_alerts.py
